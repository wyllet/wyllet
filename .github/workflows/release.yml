name: Release

# Push a tag like `v1.0.0` to publish to npm.
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere. npm only accepts
# publishes from this repository's `release.yml` workflow, as configured on npmjs.com.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./packages/wyllet/package.json').version")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"; exit 1; }
      # prepublishOnly re-runs typecheck, tests and build before anything is uploaded.
      - run: npm publish --access public
        working-directory: packages/wyllet
