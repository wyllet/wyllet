name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Runs after build so the dependency-policy test also scans the bundle.
      - run: pnpm test
      # Fails if the published bundle grows past packages/wyllet/bench/budget.json.
      - run: pnpm --filter wyllet bench
      - run: pnpm --filter playground build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter e2e build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium firefox webkit
      # Real browsers, strict CSP, a scripted wallet: connect, reject, reconnect, account and chain changes.
      - run: pnpm --filter e2e test
      - run: pnpm --filter e2e bench
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/bench-results
          retention-days: 14
