name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The website typechecks against the built package, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      # Runs after build so the dependency-policy test also scans the bundle.
      - run: pnpm test
      - run: pnpm --filter playground build
      - run: pnpm --filter site lint
      - run: pnpm --filter site build
